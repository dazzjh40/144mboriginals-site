<script>

function calculateVersion(){

const year = document.getElementById("birthyear").value;
const currentYear = new Date().getFullYear();

if(!year || year < 1900 || year > currentYear){
document.getElementById("result").innerHTML = "Please enter a valid birth year.";
return;
}

const age = currentYear - year;
const version = (age/10).toFixed(1);

/* Versions currently available in your store */

const versions = {

"4.0": {
year:"1984",
link:"https://www.etsy.com/listing/4468286122",
image:"images/version40.png"
},

"3.5": {
year:"1989",
link:"https://www.etsy.com/listing/4467172008",
image:"images/version35.png"
},

"3.0": {
year:"1994",
link:"#",
image:"images/version30.png"
},

"2.9": {
year:"1995",
link:"#",
image:"images/version29.png"
},

"2.8": {
year:"1996",
link:"#",
image:"images/version28.png"
}

};

if(versions[version]){

const item = versions[version];

let output = `
<div>You are running</div>
<h2>Version ${version}</h2>
<div>Stable build released ${item.year}</div>

<img src="${item.image}" style="width:220px;margin-top:20px;border-radius:6px;">
`;

if(item.link !== "#"){
output += `<br><a class="button" target="_blank" href="${item.link}">View Your Shirt</a>`;
}

document.getElementById("result").innerHTML = output;

}else{

document.getElementById("result").innerHTML =
`<div>You are Version ${version}</div>
<p>This release is not available yet.</p>
<p>Check the Birthday Shirt collection.</p>
<a class="button" href="birthday.html">View Available Versions</a>`;

}

}

</script>
