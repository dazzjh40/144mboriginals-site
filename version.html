<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Find Your Version | 1.44MB Originals</title>

<meta name="description" content="Find your software version birthday. Enter your birth year to discover your version release.">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>Find Your Version</h1>

<div class="tagline">
Enter your birth year to discover your software release version.
</div>

<div class="nav">
<a href="index.html">Home</a>
<a href="products.html">Products</a>
<a href="birthday.html">Birthday Shirts</a>
<a href="version.html">Find Your Version</a>
<a href="https://handyenough.etsy.com" target="_blank">Etsy Store</a>
</div>

<div class="section">

<input id="birthyear" type="number" placeholder="Enter birth year" style="padding:12px;font-size:18px;border-radius:6px;border:none;text-align:center;">

<br><br>

<button onclick="calculateVersion()" class="small-button">
Find My Version
</button>

<div id="result" style="margin-top:30px;font-size:22px;"></div>

</div>

<div class="footer">
© 2026 1.44MB Originals
</div>

</div>

<script>

function calculateVersion(){

const year = document.getElementById("birthyear").value;
const currentYear = new Date().getFullYear();

if(!year || year < 1900 || year > currentYear){
document.getElementById("result").innerHTML = "Please enter a valid birth year.";
return;
}

const age = currentYear - year;
const version = (age/10).toFixed(1);

let link = "";

if(version == "4.0") link = "https://www.etsy.com/listing/4468286122";
if(version == "3.5") link = "https://www.etsy.com/listing/4467172008";
if(version == "3.0") link = "https://www.etsy.com/listing/YOUR-LINK";
if(version == "2.9") link = "https://www.etsy.com/listing/YOUR-LINK";
if(version == "2.8") link = "https://www.etsy.com/listing/YOUR-LINK";

let output = "<div>You are running</div>";
output += "<h2>Version " + version + "</h2>";
output += "<div>Stable build released " + year + "</div>";

if(link !== ""){
output += '<br><a class="button" target="_blank" href="'+link+'">View Your Shirt</a>';
}

document.getElementById("result").innerHTML = output;

}

</script>

</body>
</html>
