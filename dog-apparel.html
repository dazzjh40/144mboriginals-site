<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">

<body>

  <div id="nav-placeholder"></div>

  <script>
    fetch("nav.html")
      .then(response => response.text())
      .then(data => {

</html>
